name: Verify foundation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npx remotion versions
      - name: Install media verification tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Render sample MP4 with mock providers
        run: npm run render:demo
      - name: Verify MP4 metadata and decode every frame
        run: |
          ffprobe -v error -count_frames -select_streams v:0 -show_entries stream=codec_name,width,height,r_frame_rate,nb_read_frames:format=duration -of json out/demo.mp4 > out/probe.json
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const props = JSON.parse(readFileSync('fixtures/render-props.generated.json', 'utf8'));
          const probe = JSON.parse(readFileSync('out/probe.json', 'utf8'));
          const stream = probe.streams[0];
          const frames = props.plan.shots.reduce((sum, shot) => sum + Math.round(shot.durationSec * props.plan.fps), 0);
          assert.equal(stream.codec_name, 'h264');
          assert.equal(stream.width, props.width);
          assert.equal(stream.height, props.height);
          assert.equal(Number(stream.nb_read_frames), frames);
          const [num, den] = stream.r_frame_rate.split('/').map(Number);
          assert.equal(num / den, props.plan.fps);
          assert.ok(Math.abs(Number(probe.format.duration) - frames / props.plan.fps) < 1 / props.plan.fps);
          console.log(`Verified ${stream.width}x${stream.height}, ${frames} frames, ${probe.format.duration}s`);
          NODE
          ffmpeg -v error -xerror -i out/demo.mp4 -f null -
      - uses: actions/upload-artifact@v4
        with:
          name: vivid-demo
          path: |
            out/demo.mp4
            out/probe.json
          if-no-files-found: error
          retention-days: 14
      - name: Render imported design fixture without generation providers
        run: npm run create:sample -- --render
      - name: Verify imported-design MP4 and create visual review sheet
        run: |
          node scripts/verify-video.mjs out/design-sample/render-props.json out/design-sample/video.mp4 out/design-sample/probe.json
          ffmpeg -v error -i out/design-sample/video.mp4 -vf "select='eq(n,30)+eq(n,150)+eq(n,240)+eq(n,330)+eq(n,420)+eq(n,540)',scale=480:-1,tile=3x2" -frames:v 1 out/design-sample/contact-sheet.jpg
      - uses: actions/upload-artifact@v4
        with:
          name: vivid-design-reveal
          path: out/design-sample/
          if-no-files-found: error
          retention-days: 14
      - name: Render reviewed planning replay without model credentials
        run: npm run create:planned-sample -- --render
      - name: Verify reviewed-plan MP4
        run: node scripts/verify-video.mjs out/planned-sample/render-props.json out/planned-sample/video.mp4 out/planned-sample/probe.json
      - uses: actions/upload-artifact@v4
        with:
          name: vivid-planning-replay
          path: out/planned-sample/
          if-no-files-found: error
          retention-days: 14
      - name: Render independently animated Figma layer fixture
        run: npm run create:layered-sample -- --render
      - name: Verify layered MP4
        run: node scripts/verify-video.mjs out/layered-sample/render-props.json out/layered-sample/video.mp4 out/layered-sample/probe.json
      - uses: actions/upload-artifact@v4
        with:
          name: vivid-layered-fixture
          path: out/layered-sample/
          if-no-files-found: error
          retention-days: 14
      - name: Reopen saved project and render a new timing without Figma
        env:
          FIGMA_ACCESS_TOKEN: ''
          OPENAI_API_KEY: ''
          ANTHROPIC_API_KEY: ''
        run: npm run create -- --project out/layered-sample --pacing fixtures/pacing.brisk.json --out out/reopened-sample --render
      - name: Verify saved-project MP4
        run: node scripts/verify-video.mjs out/reopened-sample/render-props.json out/reopened-sample/video.mp4 out/reopened-sample/probe.json
      - uses: actions/upload-artifact@v4
        with:
          name: vivid-reopened-project-fixture
          path: out/reopened-sample/
          if-no-files-found: error
          retention-days: 14
